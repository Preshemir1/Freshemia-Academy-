name: Deploy website to GitHub Pages

# Publishes public/ (the single self-contained page) so the academy site, the
# applicant wizard and the administrator console can be demonstrated from a
# permanent link. Records stay in each visitor's browser — for shared data use
# a Node host running server.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild the single-file website
        run: node build.js
        env:
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables → API_BASE). Leave it unset and the published page talks to
          # whatever origin serves it; set it to the Render/Railway URL and every
          # published copy links itself to the live portal.
          API_BASE: ${{ vars.API_BASE }}
      - name: Configure Pages (enables it on the first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
