# Render blueprint — New → Blueprint → pick this repository.
# It builds the single-file website, runs the portal server, and keeps the
# database on a persistent disk so applicants survive every redeploy.
services:
  - type: web
    name: freshemia-academy
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && node build.js
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "0"
      - key: ADMIN_EMAIL
        value: admin@freshemiaacademy.edu.ng
      - key: ADMIN_PASSWORD
        sync: false # asked for when the blueprint is applied
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
